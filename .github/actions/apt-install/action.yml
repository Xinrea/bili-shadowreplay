name: Install apt packages
description: >
  Install apt packages with a normal `apt-get update` and `apt-get install`,
  reusing the downloaded .deb files from the Actions cache. The Azure apt
  mirror is sometimes extremely slow (one install took 46 minutes), and with
  the archives cached apt only downloads packages that changed since.

inputs:
  packages:
    description: Space-separated apt packages to install.
    required: true

runs:
  using: composite
  steps:
    # The key is the exact set of .deb files this install needs, resolved
    # against fresh package lists, so any updated package (from the repository
    # or a new runner image) yields a new key that gets saved. The prefix
    # restore reuses the previous set, so only updated packages are downloaded.
    - id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        # Outside $HOME so apt's unprivileged `_apt` user can reach it.
        archives=/opt/apt-archives
        sudo mkdir -p "$archives"
        sudo chown "$(id -u):$(id -g)" "$archives"
        chmod 755 "$archives"
        echo "ARCHIVES=$archives" >> "$GITHUB_ENV"

        sudo apt-get update
        packages_hash=$(printf '%s' "$PACKAGES" | sha256sum | cut -c1-16)
        # The archives directory is still empty here, so this lists every
        # package the install will fetch, with its version in the file name.
        # Word splitting of $PACKAGES is intended.
        # shellcheck disable=SC2086
        debs_hash=$(sudo apt-get install -qq --print-uris -o Dir::Cache::Archives="$archives" $PACKAGES \
          | awk '{print $2}' | sort | sha256sum | cut -c1-16)
        prefix="apt-archives-$ImageOS-$packages_hash-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix$debs_hash" >> "$GITHUB_OUTPUT"

    - id: restore
      uses: actions/cache/restore@v4
      with:
        path: /opt/apt-archives
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        mkdir -p "$ARCHIVES/partial"
        # apt downloads into `partial` as its unprivileged `_apt` user.
        sudo chown _apt "$ARCHIVES/partial"
        # Word splitting of $PACKAGES is intended.
        # shellcheck disable=SC2086
        sudo apt-get install -y -o Dir::Cache::Archives="$ARCHIVES" $PACKAGES
        # Drop archives that the package lists no longer offer, so the cache
        # does not grow across updates, then make it readable for saving.
        sudo apt-get autoclean -o Dir::Cache::Archives="$ARCHIVES"
        sudo rm -f "$ARCHIVES/lock"
        sudo chown -R "$(id -u):$(id -g)" "$ARCHIVES"

    # Saved right after installing rather than at the end of the job, so a
    # later failure or cancellation still keeps the downloaded packages.
    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: /opt/apt-archives
        key: ${{ steps.key.outputs.key }}
