name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a PR makes its earlier, still-running checks irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The pre-commit hooks are split between two jobs: `format` runs the cheap
# hooks on every change, and `clippy-test` runs the cargo clippy/test hooks
# only when the Rust build inputs change. Each job skips the other's hooks, so
# keep both SKIP lists in sync with `.pre-commit-config.yaml`.
jobs:
  format:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit
        env:
          SKIP: cargo-clippy,cargo-clippy-headless,cargo-test,cargo-test-headless
        run: pre-commit run --all-files --show-diff-on-failure

  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}

    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Everything the cargo clippy/test hooks read. `public/icon.svg` is
          # pulled in by `include_str!` in `src-tauri/src/powerlive.rs`.
          filters: |
            rust:
              - 'src-tauri/**'
              - 'public/icon.svg'
              - '.pre-commit-config.yaml'
              - '.github/workflows/lint.yml'

  clippy-test:
    needs: changes
    # Pushes to main always run, which also keeps the caches PRs restore fresh.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-22.04
    # A warm run takes about 10 minutes; this bounds stalls such as a slow apt
    # mirror on a cache miss.
    timeout-minutes: 45
    env:
      # Debug info is unused in CI but slows compiling and linking and roughly
      # doubles the size of the Rust cache. Panic messages keep their locations.
      CARGO_PROFILE_DEV_DEBUG: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # The Azure apt mirror is sometimes extremely slow (one install took
      # 46 minutes), so restore the packages from the Actions cache instead.
      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ffmpeg libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      # Restoring from the cache only unpacks files, so refresh the dynamic
      # linker cache for the libraries the test binaries load at runtime.
      - name: Refresh shared library cache
        run: sudo ldconfig

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Swatinem/rust-cache deletes every file under non-profile `target/`
      # subdirectories, which strips the prebuilt native libs from
      # `target/sherpa-onnx-prebuilt` but keeps the extracted `lib` directory.
      # `sherpa-onnx-sys`'s build script only checks that the directory exists,
      # so whenever the crate rebuilds it never re-downloads and linking fails.
      # It rebuilds on a partial cache hit, and also on an exact hit once a new
      # runner image reruns the cached build scripts, so check for the libs
      # rather than the cache result. Drop the whole directory and force the
      # crate to rebuild so it fetches them again.
      - name: Repair sherpa-onnx prebuilt libs
        run: |
          if ! find src-tauri/target/sherpa-onnx-prebuilt -name 'libsherpa-onnx-c-api.a' 2>/dev/null | grep -q .; then
            rm -rf src-tauri/target/sherpa-onnx-prebuilt
            cargo clean -p sherpa-onnx-sys --manifest-path src-tauri/Cargo.toml
          fi

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit
        env:
          SKIP: trailing-whitespace,end-of-file-fixer,cargo-fmt
        run: pre-commit run --all-files --show-diff-on-failure
