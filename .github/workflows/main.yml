name: Encoding oracle diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ffmpeg
        with:
          packages: libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: linux-system-skia-ffmpeg9-v1
          save-if: false
      - name: Reproduce and retain the failing case
        env:
          BSR_ENCODING_DIAGNOSTICS: ${{ runner.temp }}/encoding-oracle
        run: |
          mkdir -p "$BSR_ENCODING_DIAGNOSTICS"
          lscpu > "$BSR_ENCODING_DIAGNOSTICS/cpu.txt"
          ffmpeg -version > "$BSR_ENCODING_DIAGNOSTICS/ffmpeg.txt"
          for iteration in $(seq 1 100); do
            echo "Iteration $iteration"
            cargo test --manifest-path src-tauri/Cargo.toml -p ffmpeg_utils --lib native_software_encode_and_output_seek_match_cli_profiles_and_frames -- --nocapture --test-threads=1 > "$BSR_ENCODING_DIAGNOSTICS/test.log" 2>&1 || { cat "$BSR_ENCODING_DIAGNOSTICS/test.log"; exit 1; }
          done
          cat "$BSR_ENCODING_DIAGNOSTICS/test.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encoding-oracle-diagnostics
          path: ${{ runner.temp }}/encoding-oracle
