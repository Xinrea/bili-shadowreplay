name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Runs every scripts/tests/*.test.mjs, so new test files need no CI change.
      - run: yarn test

  catalog:
    name: Recording catalog tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: ./.github/actions/setup-kache
        with:
          key: recording-catalog
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: recording-catalog
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --manifest-path src-tauri/Cargo.toml -p recording_catalog --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -p recording_catalog --all-targets --locked -- -D warnings

  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    # Bounds stalls such as a slow apt mirror on a cache miss.
    timeout-minutes: 45
    env:
      # Debug info is unused in CI but slows compiling and linking and enlarges
      # the Rust cache. Panic messages keep their locations.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Build against modern FreeType and versioned ICU instead of the old archive.
      FORCE_SKIA_BUILD: "1"
      SKIA_USE_SYSTEM_LIBRARIES: "1"
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # Use one pinned SDK for native linking and CLI parity tests.
      - name: Setup FFmpeg and system dependencies
        uses: ./.github/actions/setup-ffmpeg
        with:
          packages: fonts-wqy-microhei libclang-dev ninja-build python3 libicu-dev libpng-dev libexpat1-dev libjpeg-dev

      - name: Setup sherpa-onnx archive
        uses: ./.github/actions/setup-sherpa-onnx

      - name: Setup Rust 1.99.0
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Setup Rust compiler cache
        uses: ./.github/actions/setup-kache
        with:
          key: linux-system-skia-ffmpeg9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: linux-system-skia-ffmpeg9-v1
          # PRs restore main's cache. Saving one per PR fills the 10 GB repo
          # cache limit and evicts the larger Lint cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Same rust-cache stripping trap as the Lint workflow: on a cache hit the
      # extracted `lib` directory survives as empty dirs while the .a files are
      # gone, and `sherpa-onnx-sys`'s build script only checks the directory
      # exists, so linking would fail without forcing a rebuild. The re-extract
      # comes from SHERPA_ONNX_ARCHIVE_DIR instead of the flaky download.
      - name: Repair sherpa-onnx prebuilt libs
        run: |
          if ! find src-tauri/target/sherpa-onnx-prebuilt -name 'libsherpa-onnx-c-api.a' 2>/dev/null | grep -q .; then
            rm -rf src-tauri/target/sherpa-onnx-prebuilt
            cargo clean -p sherpa-onnx-sys --manifest-path src-tauri/Cargo.toml
          fi

      - name: Run tests
        working-directory: src-tauri
        run: |
          # Run all workspace tests except whisper-cpp-rs (requires CMake and whisper.cpp submodule)
          cargo test --workspace --lib --exclude whisper-cpp-rs
        env:
          RUST_BACKTRACE: 1

      - name: Run recorder integration tests
        working-directory: src-tauri
        run: |
          cargo test --package recorder --tests
        env:
          RUST_BACKTRACE: 1

      - name: Run application catalog migration tests
        working-directory: src-tauri
        # These live in the application binary, so --workspace --lib omits them.
        run: |
          cargo test --package bili-shadowreplay --no-default-features --features headless database::catalog --locked
          cargo test --package bili-shadowreplay --no-default-features --features headless storage_migration_tests --locked
        env:
          RUST_BACKTRACE: 1
