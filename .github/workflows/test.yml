name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Runs every scripts/tests/*.test.mjs, so new test files need no CI change.
      - run: yarn test

  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    # Bounds stalls such as a slow apt mirror on a cache miss.
    timeout-minutes: 45
    env:
      # Debug info is unused in CI but slows compiling and linking and enlarges
      # the Rust cache. Panic messages keep their locations.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Build against modern FreeType and versioned ICU instead of the old archive.
      FORCE_SKIA_BUILD: "1"
      SKIA_USE_SYSTEM_LIBRARIES: "1"
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # Native FFmpeg headers/libraries plus CLI for encoding and probe parity tests.
      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libssl-dev pkg-config ffmpeg libfontconfig1-dev fonts-wqy-microhei clang libclang-dev ninja-build python3 libicu-dev libharfbuzz-dev libpng-dev zlib1g-dev libexpat1-dev libjpeg-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: linux-system-skia-v1
          # PRs restore main's cache. Saving one per PR fills the 10 GB repo
          # cache limit and evicts the larger Lint cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        working-directory: src-tauri
        run: |
          # Run all workspace tests except whisper-cpp-rs (requires CMake and whisper.cpp submodule)
          cargo test --workspace --lib --exclude whisper-cpp-rs
        env:
          RUST_BACKTRACE: 1
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig

      - name: Run recorder integration tests
        working-directory: src-tauri
        run: |
          cargo test --package recorder --tests
        env:
          RUST_BACKTRACE: 1
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig
