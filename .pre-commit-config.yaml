fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Preserve the pinned upstream patch verbatim, including blank context.
        exclude: '^scripts/ffmpeg-sdk-patches/0001-vulkan-encode-free-queued-picture-views\.patch$'
      - id: end-of-file-fixer
        exclude: '(\.json$|public/|^src-tauri/crates/recorder/tests/fixtures/probe-[^/]+\.ts$|^scripts/ffmpeg-sdk-patches/0001-vulkan-encode-free-queued-picture-views\.patch$)'

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path src-tauri/Cargo.toml --
        language: system
        types: [rust]
        pass_filenames: false # This makes it a lot faster

      - id: cargo-clippy
        name: cargo clippy
        language: system
        types: [rust]
        pass_filenames: false
        entry: cargo clippy --manifest-path src-tauri/Cargo.toml

      - id: cargo-clippy-headless
        name: cargo clippy headless
        language: system
        types: [rust]
        pass_filenames: false
        entry: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --features headless

      - id: cargo-test
        name: cargo test
        language: system
        types: [rust]
        pass_filenames: false
        entry: cargo test --manifest-path src-tauri/Cargo.toml

      - id: cargo-test-headless
        name: cargo test headless
        language: system
        types: [rust]
        pass_filenames: false
        entry: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features headless
