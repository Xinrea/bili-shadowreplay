<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">BiliBili ShadowReplay</title>
  <desc id="desc">A white film reel and editing scissors on a rounded charcoal square.</desc>
