    <clipPath id="film">
      <path d="M62 349 408 195Q441 184 453 160L464 196Q472 229 437 248L80 410Z"/>
    </clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#191B1D"/>
