[package]
name = "current-export-comparison"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "current-export-comparison"
path = "src/main.rs"
test = false
bench = false

[dependencies]
native-overlay = { path = "../../../src-tauri/crates/native-overlay" }
ffmpeg_utils = { path = "../../../src-tauri/crates/ffmpeg_utils" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
log = "0.4"
sha2 = "0.10"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
native-overlay = { path = "../../../src-tauri/crates/native-overlay", features = ["vulkan"] }
ffmpeg_utils = { path = "../../../src-tauri/crates/ffmpeg_utils", features = ["vulkan-video"] }
tempfile = "3"
