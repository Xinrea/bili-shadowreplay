[package]
name = "overlay-perf"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "overlay-perf"
path = "src/main.rs"
test = false
bench = false

# Keep the benchmark independent of Tauri, speech runtimes and app builds.
[workspace]

[features]
default = ["current"]
current = ["dep:async-ffmpeg-sidecar", "dep:async-trait", "dep:ffmpeg_utils", "dep:log", "dep:thiserror", "dep:tokio"]

[dependencies]
native-overlay = { path = "../../src-tauri/crates/native-overlay" }
serde_json = "1"
sha2 = "0.10"
async-ffmpeg-sidecar = { version = "=0.0.3", optional = true }
async-trait = { version = "0.1", optional = true }
ffmpeg_utils = { path = "../../src-tauri/crates/ffmpeg_utils", optional = true }
log = { version = "0.4", optional = true }
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "io-util", "time"], optional = true }
