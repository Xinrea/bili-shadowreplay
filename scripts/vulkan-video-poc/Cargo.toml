[package]
name = "vulkan-video-poc"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "vulkan-video-poc"

[[bin]]
name = "vulkan-benchmark"
path = "src/benchmark/main.rs"

[[bin]]
name = "vulkan-render-probe"
path = "src/render_probe.rs"

# Exercise the real libraries without Tauri, speech runtimes or the application.
[workspace]

[dependencies]
ffmpeg_utils = { path = "../../src-tauri/crates/ffmpeg_utils", features = ["vulkan-video"] }
native-overlay = { path = "../../src-tauri/crates/native-overlay", features = ["vulkan"] }
serde_json = "1"
tempfile = "3.20"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
