[workspace]
members = ["crates/danmu_stream", "crates/recorder", "crates/whisper-cpp-rs"]
resolver = "2"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "deny"
complexity = "deny"
style = "deny"
perf = "deny"

[package]
name = "bili-shadowreplay"
version = "2.22.3"
description = "BiliBili ShadowReplay"
authors = ["Xinrea"]
license = ""
repository = ""
edition = "2021"

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
danmu_stream = { path = "crates/danmu_stream" }
recorder = { path = "crates/recorder" }
serde_json = "1.0"
reqwest = { workspace = true}
serde_derive = "1.0.158"
serde = "1.0.158"
sysinfo = "0.32.0"
m3u8-rs = { workspace = true }
async-ffmpeg-sidecar = { workspace = true }
chrono = { version = "0.4.24", features = ["serde"] }
toml = "0.9"
tokio = { version = "1.27.0", features = ["process", "fs", "sync"] }
platform-dirs = "0.3.0"
log = "0.4.22"
simplelog = "0.12.2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
rand = { workspace = true }
base64 = { workspace = true }
async-trait = "0.1.87"
whisper-cpp-rs = { path = "crates/whisper-cpp-rs" }
hound = "3.5.1"
uuid = { workspace = true }
axum = { version = "0.7", features = ["macros", "multipart"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
futures-core = "0.3"
futures = "0.3"
clap = { version = "4.5.37", features = ["derive"] }
url = "2.5.4"
srtparse = "0.2.0"
thiserror = "2"
sanitize-filename = "0.6.0"
socketioxide = "0.17.2"
sentry = { version = "0.46.0", features = ["log", "logs"] }
# Use Rig's core crate directly. The facade crate enables every provider and
# vector-store integration by default, which would add unnecessary native
# dependencies to the desktop application.
rig-core = { version = "0.40.0", default-features = false, features = ["derive", "rustls"] }

[target.'cfg(windows)'.dependencies]
sherpa-onnx = { version = "1.13.4", default-features = false, features = ["shared"] }

[target.'cfg(not(windows))'.dependencies]
sherpa-onnx = "1.13.4"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
cuda = ["whisper-cpp-rs/cuda"]
headless = []
default = ["gui"]
gui = [
    "tauri",
    "tauri-plugin-single-instance",
    "tauri-plugin-dialog",
    "tauri-plugin-shell",
    "tauri-plugin-fs",
    "tauri-plugin-http",
    "tauri-plugin-sql",
    "tauri-utils",
    "tauri-plugin-os",
    "tauri-plugin-notification",
    "tauri-plugin-deep-link",
    "tauri-plugin-autostart",
    "fix-path-env",
    "tauri-build",
]

[dependencies.tauri]
version = "2"
features = ["protocol-asset", "tray-icon"]
optional = true

[dependencies.tauri-plugin-single-instance]
version = "2"
optional = true
features = ["deep-link"]

[dependencies.tauri-plugin-dialog]
version = "2"
optional = true

[dependencies.tauri-plugin-shell]
version = "2"
optional = true

[dependencies.tauri-plugin-fs]
version = "2"
optional = true

[dependencies.tauri-plugin-http]
version = "2"
optional = true

[dependencies.tauri-plugin-sql]
version = "2"
optional = true
features = ["sqlite"]

[dependencies.tauri-utils]
version = "2"
optional = true

[dependencies.tauri-plugin-os]
version = "2"
optional = true

[dependencies.tauri-plugin-notification]
version = "2"
optional = true

[dependencies.tauri-plugin-deep-link]
version = "2"
optional = true

[dependencies.tauri-plugin-autostart]
version = "=2.5.0"
optional = true

[dependencies.fix-path-env]
git = "https://github.com/tauri-apps/fix-path-env-rs"
optional = true

[build-dependencies.tauri-build]
version = "2"
features = []
optional = true


[workspace.dependencies]
# Crates shared by the app and the workspace members. Declared once here so a
# single version is resolved and compiled instead of one copy per crate.
reqwest = { version = "0.12", features = ["json", "multipart", "gzip"] }
uuid = { version = "1.4", features = ["v4"] }
base64 = "0.22"
md5 = "0.8"
pct-str = "2.0"
rand = "0.9"
m3u8-rs = "6.0"
async-ffmpeg-sidecar = "0.0.3"

[profile.release]
debug = 1
