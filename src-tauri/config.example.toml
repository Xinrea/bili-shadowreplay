output = "./output"
live_start_notify = true
live_end_notify = true
clip_notify = true
post_notify = true
auto_subtitle = false
mcp_enabled = false
mcp_port = 18763
subtitle_generator_type = "whisper_online"
whisper_model = "./whisper_model.bin"
whisper_prompt = "这是一段中文 你们好"
openai_api_key = ""
clip_name_format = "[{room_id}][{live_id}][{title}][{created_at}].mp4"

[llm]
provider = "openai"
endpoint = "https://api.openai.com/v1"
api_key = ""
model = ""

[auto_generate]
enabled = false
encode_danmu = false

# One-time bootstrap only. After the first successful database import these
# settings are DB-owned and omitted from saved TOML; use recording storage
# settings/API to change them. Each new recording chooses the current default
# unless its recorder has an explicit preference. Resumes keep their binding.
[storage]
default_backend = "default"

# Preserve the old cache root on upgrade. Legacy archives are pinned during
# import; changing defaults never redirects them. Removal retains archive rows
# but disables file operations. Removed IDs stay reserved; use a new ID.
[storage.backends.default]
type = "local"
root = "./cache"

# [storage.backends.archive]
# type = "local"
# root = "/mnt/recordings"
# S3 is not implemented. Custom adapters must register their IDs in app code.
