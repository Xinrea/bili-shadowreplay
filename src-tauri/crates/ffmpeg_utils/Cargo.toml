[package]
name = "ffmpeg_utils"
version = "0.1.0"
edition = "2021"

[lib]
name = "ffmpeg_utils"
path = "src/lib.rs"

[features]
# External executable oracles only; production media paths use linked libraries.
cli-test-oracles = ["tokio/process"]
# GPU-frame bridge and shared compute compositor; requires FFmpeg 9 with Vulkan.
vulkan-video = ["dep:ash"]

[dependencies]
ash = { version = "=0.38.0", default-features = false, features = ["std"], optional = true }
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["format", "software-resampling", "filter"] }
ffmpeg-sys-next = { version = "=9.0.1", default-features = false }
flate2 = "1.1"
tokio = { version = "1.48.0", features = ["fs", "rt", "time"] }
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.20"

[dev-dependencies]
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["fs", "macros", "rt-multi-thread", "net", "io-util", "process", "sync", "time"] }

[build-dependencies]
cc = "1"

[lints]
workspace = true
