[package]
name = "ffmpeg_utils"
version = "0.1.0"
edition = "2021"

[lib]
name = "ffmpeg_utils"
path = "src/lib.rs"

[dependencies]
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["format", "software-resampling", "filter"] }
flate2 = "1.1"
tokio = { version = "1.48.0", features = ["fs", "process", "rt", "time"] }
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.20"

[dev-dependencies]
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["fs", "macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }

[lints]
workspace = true
