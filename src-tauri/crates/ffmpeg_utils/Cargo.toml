[package]
name = "ffmpeg_utils"
version = "0.1.0"
edition = "2021"

[lib]
name = "ffmpeg_utils"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.48.0", features = ["fs", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["fs", "macros", "rt-multi-thread"] }

[lints]
workspace = true
