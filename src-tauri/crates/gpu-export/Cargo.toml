[package]
name = "gpu-export"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[features]
vulkan = ["dep:native-overlay", "dep:serde_json"]

[target.'cfg(target_os = "macos")'.dependencies]
native-overlay = { path = "../native-overlay", features = ["metal"] }
serde_json = "1"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
native-overlay = { path = "../native-overlay", features = ["vulkan"], optional = true }
serde_json = { version = "1", optional = true }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
