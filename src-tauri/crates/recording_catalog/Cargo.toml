[package]
name = "recording_catalog"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
fs2 = "0.4"
futures = "0.3"
object_store = { version = "=0.14.2", features = ["aws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3.20"
tokio = { version = "1", features = ["fs", "rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "process"] }
